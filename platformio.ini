; agri-env-poe — M5Stack ATOM PoE environmental node
;   ENV III (SHT30 + QMP6988) + SCD41 CO2 → MQTT + UECS-CCM
;
; Hardware
;   - M5Stack ATOM PoE Kit (ATOM Lite + PoE Base with W5500 Ethernet)
;   - M5Stack Grove I2C HUB on G26/G32
;       - ENV III (SHT30 0x44 + QMP6988 0x70)
;       - SCD41 CO2 sensor (0x62)
;
; I2C mapping
;   M5 G26 (SDA) <-> Grove HUB <-> sensor SDA
;   M5 G32 (SCL) <-> Grove HUB <-> sensor SCL
;
; Build / upload
;   - First flash via USB-C
;   - Subsequent flashes over Ethernet via ArduinoOTA (discovered as agri-env-XX)

[env:m5atom-poe]
; pioarduino fork pins to arduino-esp32 3.x, which is the first release
; with ETH.begin(ETH_PHY_W5500, ...) — i.e. an ESP-IDF-lwIP-backed driver
; for the W5500. That lets ESPmDNS / ArduinoOTA actually work (the
; arduino-libraries/Ethernet path uses the W5500's own offloaded stack
; and bypasses lwIP entirely, which is why mDNS was dead). Side effect:
; sockets are now NetworkServer / NetworkClient / NetworkUDP (the
; transport-agnostic types in arduino-esp32 3.x).
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.38
board = m5stack-atom
framework = arduino
monitor_speed = 115200
upload_speed = 115200

build_flags =
	-DCORE_DEBUG_LEVEL=3
	-DARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
	bblanchon/ArduinoJson@^7.0.0
	knolleary/PubSubClient@^2.8
	fastled/FastLED@^3.6.0
	sensirion/Sensirion I2C SCD4x@^1.1.0
	; ENV III sensors (SHT30 + QMP6988). Pinned to M5Unit-ENV 1.0.1 — last
	; version before the M5UnitUnified refactor; ~27 KB vs ~145 KB. Provides
	; SHT3X and QMP6988 classes directly. (robtillaart/SHT31 was an option
	; for SHT30 but using M5's keeps both ENV III sensors in one lib.)
	m5stack/M5Unit-ENV@=1.0.1
